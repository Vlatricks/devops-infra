---
- hosts: webservers
  remote_user: ubuntu
  become: true
  tasks:
    - name: Update apt cache and install Docker with Compose plugin
      apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: yes

    - name: Ensure docker service is running and enabled
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

